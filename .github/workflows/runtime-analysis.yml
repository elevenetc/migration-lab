name: Migration Lab runtime analysis

on:
  workflow_call:
    inputs:
      migrations-directory:
        description: Repository-relative directory containing the SQL migration history
        required: true
        type: string
  workflow_dispatch:
    inputs:
      migrations-directory:
        description: Repository-relative directory containing the SQL migration history
        required: true
        type: string

permissions:
  contents: read

jobs:
  analyze:
    name: Runtime analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.artifacts.outputs.artifact-id }}
    concurrency:
      group: migration-lab-${{ github.workflow }}-${{ inputs.migrations-directory }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      CALLER_ROOT: ${{ github.workspace }}/caller
      MIGRATION_LAB_ROOT: ${{ github.workspace }}/migration-lab
      MIGRATIONS_DIRECTORY: ${{ inputs.migrations-directory }}
      RESULTS_DIR: ${{ github.workspace }}/migration-lab-results
    steps:
      - name: Check out migrations
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: caller
          persist-credentials: false

      # The github context belongs to the caller. The job context identifies
      # this reusable workflow, so its CI command and CLI come from the same SHA.
      - name: Check out Migration Lab
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: migration-lab
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: migration-lab/backend/go.mod
          cache-dependency-path: migration-lab/backend/go.sum

      - name: Build CI command
        working-directory: migration-lab/backend
        shell: bash
        run: |
          mkdir -p "$RESULTS_DIR" ../build
          exec > >(tee "$RESULTS_DIR/ci-build.log") 2>&1
          go build -o ../build/migration-lab-ci ./cmd/ci

      - name: Select migrations
        id: plan
        run: '"$MIGRATION_LAB_ROOT/build/migration-lab-ci" plan'

      # The CLI imports the HTML report package, whose embedded assets must
      # exist at build time even though this workflow only produces JSON.
      - name: Set up Node.js
        if: steps.plan.outputs.has-targets == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: migration-lab/frontend/package-lock.json

      - name: Build CLI
        if: steps.plan.outputs.has-targets == 'true'
        working-directory: migration-lab
        shell: bash
        run: |
          exec > >(tee "$RESULTS_DIR/build.log") 2>&1
          npm ci --prefix frontend
          npm run build --prefix frontend
          cp -r frontend/dist backend/internal/report/dist
          mkdir -p build
          cd backend
          go build -o ../build/migration-lab ./cmd/cli

      - name: Check Docker
        if: steps.plan.outputs.has-targets == 'true'
        run: docker info > "$RESULTS_DIR/docker-info.txt" 2>&1

      - name: Analyze migrations
        if: steps.plan.outputs.has-targets == 'true'
        run: '"$MIGRATION_LAB_ROOT/build/migration-lab-ci" run'

      - name: Upload results and diagnostic logs
        id: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-lab-${{ github.run_id }}-${{ github.run_attempt }}
          path: migration-lab-results/
          if-no-files-found: warn
          retention-days: 7

  comment:
    name: PR summary
    needs: analyze
    # Fork and Dependabot pull_request tokens are read-only. Keep their analysis
    # and artifacts without trying to publish with an unavailable permission.
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: migration-lab-comment-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      MIGRATIONS_DIRECTORY: ${{ inputs.migrations-directory }}
      RESULTS_DIR: ${{ github.workspace }}/migration-lab-results
      ANALYSIS_STATUS: ${{ needs.analyze.result }}
    steps:
      # Only trusted analyzer code is checked out in this job. The analysis job
      # retains read-only permissions and never receives the publishing token.
      - name: Check out Migration Lab
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: migration-lab
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: migration-lab/backend/go.mod
          cache-dependency-path: migration-lab/backend/go.sum

      - name: Download analysis results
        if: needs.analyze.outputs.artifact-id != ''
        uses: actions/download-artifact@v4
        # An early build or checkout failure may leave no artifact. Publish a
        # failure summary with a run link in that case, replacing any old success.
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.analyze.outputs.artifact-id }}
          path: migration-lab-results
          merge-multiple: true

      - name: Create or update PR comment
        working-directory: migration-lab/backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./cmd/ci comment
