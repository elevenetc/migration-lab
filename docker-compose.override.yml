# Auto-merged by `docker compose` on top of docker-compose.yml.
# Turns the frontend into a Vite dev server with HMR:
# local source is bind-mounted, changes reload live, published ports stay
# the same so Playwright reaches them exactly like the prod build.
services:
  backend:
    # Bind-mount a single narrow root read-only at the same path so absolute
    # paths passed via ?migrationsPath=<abs-dir> resolve identically inside the
    # container. Defaults to ~/dev; override MIGRATIONS_ROOT (e.g. in .env)
    volumes:
      - ${MIGRATIONS_ROOT:-${HOME}/dev}:${MIGRATIONS_ROOT:-${HOME}/dev}:ro

  frontend:
    build:
      dockerfile: Dockerfile.dev
    environment:
      # bind-mount fs events don't propagate into the container on macOS -> poll
      - CHOKIDAR_USEPOLLING=true
      # inside the compose network the backend is reachable by service name
      - VITE_API_TARGET=http://backend:8080
      - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
      - VITE_SENTRY_ENVIRONMENT=${VITE_SENTRY_ENVIRONMENT:-}
      - VITE_SENTRY_RELEASE=${SENTRY_RELEASE:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules # anonymous volume shadows host node_modules (arch mismatch)
